services:
  yolo-studio:
    image: yolo-studio:latest
    build: .
    ports:
      - "5013:5013"
    shm_size: "2gb"
    environment:
      - CPU_THREADS=14
      - OMP_NUM_THREADS=14
      - MKL_NUM_THREADS=14
      - YOLO_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - APP_PORT=5013
    volumes:
      # CentOS SELinux 需 :z
      - ./data:/app/data:z
      - ./weights:/app/weights:z
    restart: unless-stopped
